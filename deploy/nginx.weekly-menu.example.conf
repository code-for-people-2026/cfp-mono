# 独立保存为 /etc/nginx/conf.d/cfp-weekly-menu.conf。
# 容器端口 3304 只绑定 loopback，安全组无需新增公网端口。
server {
  listen 80;
  server_name weekly-menu-api.codeforpeople.cn;
  return 308 https://weekly-menu-api.codeforpeople.cn$request_uri;
}

server {
  listen 443 ssl http2;
  server_name weekly-menu-api.codeforpeople.cn;

  ssl_certificate /etc/nginx/ssl/weekly-menu-api/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/weekly-menu-api/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://127.0.0.1:3304;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
