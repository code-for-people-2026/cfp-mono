# Replace reserved example domain and certificate paths after verifying the existing miniapp.
server {
  listen 80;
  server_name kith-inn.example.invalid;
  return 308 https://kith-inn.example.invalid$request_uri;
}
server {
  listen 443 ssl;
  server_name kith-inn.example.invalid;
  ssl_certificate /etc/nginx/ssl/kith-inn/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/kith-inn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 128k;
  # API emits redacted request logs. Avoid logging login query strings at the proxy.
  access_log off;
  location /api/kith-inn/ {
    proxy_pass http://127.0.0.1:3305;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }
  location / { return 404; }
}
