name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      website_affected: ${{ steps.deploy_targets.outputs.website }}
      weekly_menu_affected: ${{ steps.deploy_targets.outputs.weekly_menu }}
      deploy_targets: ${{ steps.deploy_targets.outputs.targets }}
      preview_matrix: ${{ steps.deploy_targets.outputs.preview_matrix }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54324/cfp
      WEEKLY_MENU_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54324/cfp_weekly_menu_test
      PAYLOAD_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54324/cfp
      PAYLOAD_SECRET: ci-secret
      PAYLOAD_DB_PUSH: "true"
      ALLOW_ADMIN_BOOTSTRAP: "true"
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 54324:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cfp
        options: >-
          --health-cmd "pg_isready -U postgres -d cfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create isolated Weekly Menu test database
        run: >-
          pnpm --dir apps/weekly-menu-be exec node --input-type=module -e
          "import pg from 'pg'; const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect(); await client.query('CREATE DATABASE cfp_weekly_menu_test'); await client.end();"

      - id: deploy_targets
        name: Resolve affected deploy targets
        env:
          DEPLOY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DEPLOY_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash deploy/resolve-deploy-targets.sh

      - name: Run deployment contract tests
        run: |
          bash deploy/tests/production-targets.test.sh
          bash deploy/tests/website-preview.test.sh
          bash deploy/tests/weekly-menu-deploy.test.sh
          bash deploy/tests/website-smoke.test.sh

      - run: pnpm verify

      # e2e 只在 PR 时跑。merge 进 main(push)时省掉(playwright install 浏览器 + e2e 较慢),
      # 但上面 pnpm verify 里的 unit(lint+typecheck+test:coverage+knip+build)仍跑,作为
      # merge 后的快速复查 + 防御绕过 PR 直推 main 的提交。
      - run: pnpm --filter @cfp/website exec playwright install --with-deps chromium
        if: github.event_name == 'pull_request'

      - name: Run affected E2E
        env:
          E2E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm turbo run test:e2e --concurrency=1 --filter="...[$E2E_BASE_SHA]"
        if: github.event_name == 'pull_request'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            apps/*/coverage
            apps/*/playwright-report
            apps/*/test-results

  preview-images:
    name: Preview image (${{ matrix.target }})
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.preview_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: No deployable target affected
        if: matrix.skip
        run: echo 'No deployable target was affected by this pull request.'

      - name: Build affected deployable image
        if: ${{ !matrix.skip }}
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          RELEASE_SHA: ${{ github.sha }}
        run: docker build --build-arg RELEASE_SHA="$RELEASE_SHA" -f "$DOCKERFILE" -t "$IMAGE:preview" .

  preview-build:
    name: preview-build
    needs: [verify, preview-images]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require verification and affected image builds
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PREVIEW_RESULT: ${{ needs.preview-images.result }}
        run: |
          [[ "$VERIFY_RESULT" == success ]]
          [[ "$PREVIEW_RESULT" == success ]]

  website-preview:
    name: website-preview
    needs: [verify, preview-build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: website-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - id: gate
        name: Require a verified trusted website change
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PREVIEW_BUILD_RESULT: ${{ needs.preview-build.result }}
          WEBSITE_AFFECTED: ${{ needs.verify.outputs.website_affected }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$VERIFY_RESULT" != success || "$PREVIEW_BUILD_RESULT" != success ]]; then
            echo 'Website Preview requires verify and preview-build to succeed.' >&2
            exit 1
          fi
          if [[ "$WEBSITE_AFFECTED" != true ]]; then
            echo 'No website change requires a Vercel Preview.'
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo 'Website Preview is limited to trusted branches in the base repository.' >&2
            echo 'Move the reviewed commits to a base-repository branch before merging.' >&2
            exit 1
          fi
          echo 'should_deploy=true' >> "$GITHUB_OUTPUT"

      - id: previous
        name: Find the previous Preview deployment
        if: steps.gate.outputs.should_deploy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cfp-website-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const comment = comments.find(
              ({ body, user }) => body?.startsWith(marker) && user?.type === 'Bot',
            );
            const match = comment?.body?.match(/https:\/\/[a-z0-9.-]+\.vercel\.app\b/i);
            core.setOutput('url', match?.[0] ?? '');

      - name: Check out the exact PR head
        if: steps.gate.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        if: steps.gate.outputs.should_deploy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Set up Node.js
        if: steps.gate.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned Vercel CLI
        if: steps.gate.outputs.should_deploy == 'true'
        run: pnpm add --global vercel@56.3.2

      - name: Validate Vercel Preview credentials
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_PROJECT_ID }}
        run: |
          [[ -n "$VERCEL_TOKEN" ]]
          [[ "$VERCEL_ORG_ID" == team_* ]]
          [[ "$VERCEL_PROJECT_ID" == prj_* ]]

      - name: Pull Vercel Preview settings
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_PROJECT_ID }}
        run: vercel pull --yes --environment=preview

      - id: deploy
        name: Deploy the website Preview
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_PROJECT_ID }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          deployment_url="$(vercel deploy --yes --archive=tgz \
            --env RELEASE_SHA="$PR_HEAD_SHA" \
            --meta cfpPrNumber="$PR_NUMBER" \
            --meta cfpCommitSha="$PR_HEAD_SHA")"
          deployment_url="${deployment_url%/}"
          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo 'Vercel did not return a valid Preview URL.' >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify the website Preview
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash deploy/verify-website-preview.sh

      - name: Remove an unsuccessful Preview deployment
        if: failure() && steps.deploy.outputs.url != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: bash deploy/remove-vercel-preview.sh

      - name: Publish the Preview URL
        if: steps.gate.outputs.should_deploy == 'true'
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cfp-website-preview -->';
            const body = [
              marker,
              '### Website Preview',
              '',
              `- [Open the Vercel Preview](${process.env.DEPLOYMENT_URL})`,
              `- Commit: \`${process.env.RELEASE_SHA}\``,
              '- Checks: `/api/health` and `/api/ready` passed',
              '',
              'This deployment uses Preview-only credentials and an isolated Neon database branch.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(
              ({ body, user }) => body?.startsWith(marker) && user?.type === 'Bot',
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
            core.summary
              .addHeading('Website Preview')
              .addLink('Open deployment', process.env.DEPLOYMENT_URL)
              .addCodeBlock(process.env.RELEASE_SHA)
              .write();

      - name: Remove the superseded Preview deployment
        if: >-
          steps.gate.outputs.should_deploy == 'true' &&
          steps.previous.outputs.url != '' &&
          steps.previous.outputs.url != steps.deploy.outputs.url
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_PREVIEW_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBSITE_PREVIEW_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.previous.outputs.url }}
        run: bash deploy/remove-vercel-preview.sh

  deploy-website:
    name: Deploy website production
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' && needs.verify.outputs.website_affected == 'true'
    uses: ./.github/workflows/deploy-production.yml
    with:
      release_sha: ${{ github.sha }}
    secrets: inherit
