name: Deploy Website Production

on:
  workflow_call:
    inputs:
      release_sha:
        description: Immutable commit SHA to build and deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Check production deployment configuration
        env:
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION_ID: ${{ vars.ALIYUN_REGION_ID }}
          ALIYUN_RDS_INSTANCE_ID: ${{ vars.ALIYUN_RDS_INSTANCE_ID }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash deploy/check-website-production-config.sh

  deploy:
    needs: prepare
    if: needs.prepare.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: Production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      WEBSITE_IMAGE_TAG: ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/cfp-website:${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@v4

      # deploy job 只负责「build 镜像 + 发货」:不在 host 装 node_modules、不跑测试。
      # 测试由 ci.yml 在 PR/push 时守,这里再跑 pnpm verify 只会让 host 与 docker 各占一份
      # 磁盘,曾叠加撑爆 runner ~15GB 可用空间。docker build 自带 install + next build,
      # smoke test 只用 curl,所以 host 的 pnpm/node setup 一并去掉。
      - name: Free disk space
        run: |
          # ubuntu-latest 预装了 Android/.NET/Haskell 等约 50GB 工具链,website 镜像 docker build
          # 时 layer 解压(monaco-editor/next/sharp)需要空间,删掉用不上的预装腾出 15-25GB。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/az /usr/local/share /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Login to Alibaba Cloud ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build image
        run: |
          docker build --build-arg RELEASE_SHA="$RELEASE_SHA" \
            -f apps/website/Dockerfile -t "$WEBSITE_IMAGE_TAG" .

      - id: push
        name: Push immutable website image
        run: bash deploy/push-website-image.sh

      - name: Install Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: 3.3.18

      - id: stage
        name: Stage website candidate without changing the active runtime
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          WEBSITE_IMAGE: ${{ env.WEBSITE_IMAGE_TAG }}@${{ steps.push.outputs.website_digest }}
        run: |
          set -euo pipefail
          remote="$ECS_USER@$ECS_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/cfp-ecs
          printf '%s\n' "$ECS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cfp-ecs ~/.ssh/known_hosts
          trap 'rm -f .env.production.remote .env.images.remote' EXIT
          cat > .env.production.remote <<EOF
          DATABASE_URL=$DATABASE_URL
          PAYLOAD_DATABASE_URL=$DATABASE_URL
          PAYLOAD_SECRET=$PAYLOAD_SECRET
          PAYLOAD_DB_PUSH=false
          ALLOW_ADMIN_BOOTSTRAP=false
          NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
          DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
          DEEPSEEK_BASE_URL=$DEEPSEEK_BASE_URL
          DEEPSEEK_MODEL=$DEEPSEEK_MODEL
          EOF

          cat > .env.images.remote <<EOF
          WEBSITE_IMAGE=$WEBSITE_IMAGE
          EOF

          ssh -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes "$remote" "mkdir -p ~/cfp-mono/deploy"
          scp -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes deploy/docker-compose.prod.yml "$remote:~/cfp-mono/docker-compose.yml.next"
          scp -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes .env.production.remote "$remote:~/cfp-mono/.env.production.next"
          scp -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes .env.images.remote "$remote:~/cfp-mono/.env.next"
          scp -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes deploy/deploy-website-candidate.sh "$remote:~/cfp-mono/deploy/"
          printf '%s' "$ACR_PASSWORD" | ssh -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes "$remote" \
            "docker login --username '$ACR_USERNAME' --password-stdin '$ACR_REGISTRY'"
          # pull 前清掉未用旧镜像 + 构建缓存:ECS 40G 盘会被历次 deploy 累积的旧镜像撑满
          # (曾导致 docker compose pull 解压时 no space left on device)。prune -af 只删
          # "没有运行中容器引用的"镜像 → 当前在跑的旧版保留, 新镜像失败可回滚上一版;
          # 更早的历史 tag 永久留在阿里云 ACR, 需要时 docker pull 回滚。
          ssh -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes "$remote" \
            "chmod 700 ~/cfp-mono/deploy/deploy-website-candidate.sh && chmod 600 ~/cfp-mono/docker-compose.yml.next ~/cfp-mono/.env.next ~/cfp-mono/.env.production.next && docker system prune -af && RELEASE_SHA='$RELEASE_SHA' bash ~/cfp-mono/deploy/deploy-website-candidate.sh preflight-candidate"

      - id: gate
        name: Gate website writes before creating the recovery point
        timeout-minutes: 10
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          remote="$ECS_USER@$ECS_HOST"
          ssh -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes "$remote" \
            "RELEASE_SHA='$RELEASE_SHA' bash ~/cfp-mono/deploy/deploy-website-candidate.sh gate-writes"

      - id: backup
        name: Create and verify website RDS recovery point
        timeout-minutes: 35
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_CLI_PLUGIN_AUTO_INSTALL: "true"
          ALIYUN_REGION_ID: ${{ vars.ALIYUN_REGION_ID }}
          ALIYUN_RDS_INSTANCE_ID: ${{ vars.ALIYUN_RDS_INSTANCE_ID }}
          PAYLOAD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          backup="$(bash deploy/create-rds-backup.sh)"
          backup_id="$(jq -er .backupId <<<"$backup")"
          backup_created_at="$(jq -er .backupCreatedAt <<<"$backup")"
          printf '### website recovery point\n\n- Backup ID: `%s`\n- Created at: `%s`\n' \
            "$backup_id" "$backup_created_at" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy website candidate on ECS
        id: rollout
        timeout-minutes: 10
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          remote="$ECS_USER@$ECS_HOST"
          ssh -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes "$remote" \
            "RELEASE_SHA='$RELEASE_SHA' bash ~/cfp-mono/deploy/deploy-website-candidate.sh deploy"

      - name: Smoke test
        timeout-minutes: 5
        # 保留 www 的 Host/SNI 与证书校验，但绕过 CDN 直连 ECS，验证刚切换的源站容器。
        env:
          SITE_URL: https://www.codeforpeople.cn
          SITE_CONNECT_TO: www.codeforpeople.cn:443:${{ secrets.ECS_HOST }}:443
        run: bash deploy/smoke-test.sh website

      - name: Finalize website release
        timeout-minutes: 10
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes "$ECS_USER@$ECS_HOST" \
            "RELEASE_SHA='$RELEASE_SHA' bash ~/cfp-mono/deploy/deploy-website-candidate.sh finalize"

      - name: Restore the last-good website when rollout validation fails
        if: ${{ (failure() || cancelled()) && steps.gate.outcome != 'skipped' }}
        timeout-minutes: 15
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          ssh -i ~/.ssh/cfp-ecs -o StrictHostKeyChecking=yes "$ECS_USER@$ECS_HOST" \
            "RELEASE_SHA='$RELEASE_SHA' bash ~/cfp-mono/deploy/deploy-website-candidate.sh restore-runtime"

      - name: Remove local website deployment credentials
        if: always()
        env:
          ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
        run: |
          docker logout "$ACR_REGISTRY" >/dev/null 2>&1 || true
          rm -f ~/.ssh/cfp-ecs ~/.ssh/known_hosts .env.production.remote .env.images.remote
